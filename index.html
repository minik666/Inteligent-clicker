<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Model Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* bg-slate-900 */
      }
      .clickable-shadow {
        filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.2)) drop-shadow(0 4px 3px rgb(0 0 0 / 0.2));
      }
      .clickable-shadow:active {
        filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.3));
      }
      
      @keyframes float-up {
        0% {
          transform: translateY(0);
          opacity: 1;
        }
        100% {
          transform: translateY(-80px);
          opacity: 0;
        }
      }

      .animate-float-up {
        animation: float-up 1.5s ease-out forwards;
      }

      @keyframes pulse-cyan {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px rgba(103, 232, 249, 0.6));
        }
        50% {
          transform: scale(1.1);
          filter: drop-shadow(0 0 20px rgba(103, 232, 249, 0.6));
        }
      }

      .animate-pulse-cyan {
        animation: pulse-cyan 2s infinite;
      }
      
      @keyframes slide-in-out {
        0% { transform: translateX(110%); opacity: 0; }
        15% { transform: translateX(0); opacity: 1; }
        85% { transform: translateX(0); opacity: 1; }
        100% { transform: translateX(110%); opacity: 0; }
      }
      .animate-slide-in-out {
        animation: slide-in-out 5s ease-in-out forwards;
      }

    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
